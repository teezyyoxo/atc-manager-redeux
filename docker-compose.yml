services:
  web:
    image: "atc-manager:${APP_VERSION:-2.5.1}"
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-2.5.1}"
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
