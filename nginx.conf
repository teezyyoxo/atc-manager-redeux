server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location ~ ^/(?:sw|sw-esm)\.js$ {
        try_files $uri =404;
        expires epoch;
    }

    location = /manifest.json {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:js|css|json|xml|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
